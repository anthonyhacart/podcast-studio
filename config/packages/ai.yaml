ai:
    platform:
        mistral:
            api_key: '%env(MISTRAL_API_KEY)%'
            # records/replays API responses when CASSETTE is set (make demo)
            http_client: App\Http\ReplayableHttpClient

    agent:
        # Writes the episode script from a brief; ScriptWriter checks it and asks again once if needed.
        writer:
            platform: 'ai.platform.mistral'
            model: '%env(WRITER_MODEL)%'
            prompt:
                file: '%kernel.project_dir%/config/prompts/writer.md'
