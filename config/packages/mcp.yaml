mcp:
    servers:
        default:
            name: podcast-studio
            version: 0.1.0
            description: 'A podcast studio: two AI hosts write and voice episodes from the sources you bring.'
            instructions: |
                You are the editor of a two-host podcast. To make an episode:
                1. Gather sources on the topic yourself (web search, files, what the user gave you) and put every fact the hosts need in the notes of each source: the hosts only use these facts.
                2. Call draft_episode, then show the script to the user. Before that, compare each line with your sources and point out any claim they do not state.
                3. Call revise_episode with the fixes and the user's changes, as many times as needed.
                4. Call publish_episode only once the user approves the script.
            registry: 'App\Mcp\'
            http:
                path: /mcp
            # bin/console mcp:server, for clients that only speak STDIO (run it with APP_DEBUG=0: any other output breaks the protocol)
            transports:
                stdio: true
