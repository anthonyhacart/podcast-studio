# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    app.episodes_dir: '%kernel.project_dir%/var/episodes'
    app.questions_dir: '%kernel.project_dir%/var/questions'
    app.show:
        title: 'Podcast Studio'
        description: 'Two AI hosts, Paul and Jane, on whatever you ask them about. Every episode is drafted from the sources you bring, reviewed with you in your MCP client, then voiced.'
        author: 'Podcast Studio'
        language: en
        # who hosts an episode when its editor does not choose
        cast: [paul, jane]
        hosts:
            paul:
                name: Paul
                persona: 'The enthusiast. Gets carried away, loves underdogs and big moments.'
                voices:
                    neutral: en_paul_neutral
                    excited: en_paul_excited
                    happy: en_paul_happy
                    confident: en_paul_confident
                    sad: en_paul_sad
                    frustrated: en_paul_frustrated
            jane:
                name: Jane
                persona: 'The analyst. Dry British wit, checks the facts, deflates the hype.'
                voices:
                    neutral: gb_jane_neutral
                    sarcasm: gb_jane_sarcasm
                    curious: gb_jane_curious
                    confident: gb_jane_confident
                    confused: gb_jane_confused
                    sad: gb_jane_sad
            oliver:
                name: Oliver
                persona: 'The storyteller. Unhurried British charm, loves an anecdote and the history behind things.'
                voices:
                    neutral: gb_oliver_neutral
                    curious: gb_oliver_curious
                    excited: gb_oliver_excited
                    cheerful: gb_oliver_cheerful
                    confident: gb_oliver_confident
                    sad: gb_oliver_sad
            marie:
                name: Marie
                persona: 'The curious one. French, asks the questions listeners have, delighted by odd facts.'
                voices:
                    neutral: fr_marie_neutral
                    curious: fr_marie_curious
                    excited: fr_marie_excited
                    happy: fr_marie_happy
                    sad: fr_marie_sad
            # one voice, one mood: the character is in the persona
            harriet:
                name: Harriet
                persona: 'The fact-checker. Deadpan, precise, never impressed.'
                voices:
                    neutral: voice_590
            howard:
                name: Howard
                persona: 'The old-school broadcaster. Formal and measured, treats every topic like the evening news.'
                voices:
                    neutral: voice_3147

    # the hosts' voices when VOICE_PLATFORM=voicestudio: KittenTTS presets, one per host whatever the emotion
    # (VOICE_MODEL=kittentts); with a cloning engine, a voice profile id or name of the VoiceStudio app
    app.voicestudio_voices:
        paul: expr-voice-2-m
        jane: expr-voice-2-f
        oliver: expr-voice-3-m
        marie: expr-voice-3-f
        howard: expr-voice-4-m
        harriet: expr-voice-4-f

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'
        # built by SpeechPlatformFactory, not services
        exclude: '../src/Speech/'

    # the web search of the "researcher" agent (config/packages/ai.yaml)
    Symfony\AI\Agent\Bridge\Tavily\Tavily:
        arguments:
            # recorded and replayed like the Mistral API when CASSETTE is set
            $httpClient: '@App\Replay\ReplayableHttpClient'
            $apiKey: '%env(TAVILY_API_KEY)%'
            $options: { include_images: false, max_results: 8 }

    # a local VoiceStudio (VOICE_PLATFORM=voicestudio), see App\Speech\SpeechModel
    app.platform.voicestudio:
        class: Symfony\AI\Platform\Platform
        factory: [App\Speech\SpeechPlatformFactory, create]
        arguments:
            $httpClient: '@http_client'
            $baseUrl: '%env(VOICESTUDIO_URL)%'
            $model: '%env(VOICE_MODEL)%'
            $apiKey: '%env(default::VOICESTUDIO_API_KEY)%'

when@test:
    parameters:
        app.episodes_dir: '%kernel.cache_dir%/episodes'
        app.questions_dir: '%kernel.cache_dir%/questions'
